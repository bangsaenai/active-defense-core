name: Active Defense Core CI Benchmark

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-benchmark:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build C-Core Project
      run: cmake --build build --config Release

    - name: Run Windows Executables
      run: |
        if exist build\Release\*.exe (
          for %%f in (build\Release\*.exe) do (
            echo Running %%f
            "%%f"
          )
        ) else (
          echo No exe found in build\Release
        )
      shell: cmd