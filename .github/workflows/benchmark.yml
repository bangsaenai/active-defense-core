name: Active Defense Core CI Benchmark

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-benchmark:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build C-Core Project
      run: cmake --build build --config Release

    - name: Run Windows Test & Benchmark Executables
      run: |
        set PATH=%CD%\build\Release;%PATH%
        if exist build\Release\test_runner.exe (
            echo --- Running Test Runner ---
            build\Release\test_runner.exe
        )
        if exist build\Release\test_nuclear.exe (
            echo --- Running Nuclear Test ---
            build\Release\test_nuclear.exe
        )
        if exist build\Release\benchmark_perf.exe (
            echo --- Running Benchmark Perf ---
            build\Release\benchmark_perf.exe
        )
        exit /b 0
      shell: cmd