name: Active Defense Core CI Benchmark

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-benchmark:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build C-Core Project
      run: cmake --build build --config Release

    - name: Run Automated Unit Tests
      run: .\build\Release\test_runner.exe
      shell: cmd

    - name: Run Microsecond Speed Benchmark
      run: .\build\Release\benchmark_perf.exe
      shell: cmd