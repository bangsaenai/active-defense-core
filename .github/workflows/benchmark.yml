name: Active Defense Core CI Benchmark

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-benchmark:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build C-Core Project
      run: cmake --build build --config Release

    - name: Run Windows Executables
      run: |
        $exeList = Get-ChildItem -Path build -Recurse -Filter "*.exe"
        if ($exeList) {
            foreach ($exe in $exeList) {
                Write-Host "Executing binary: $($exe.FullName)"
                & $exe.FullName
            }
        } else {
            Write-Host "Build completed successfully."
        }
      shell: powershell