name: Active Defense Core CI Benchmark

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-benchmark:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build C-Core Project
      run: cmake --build build --config Release

    - name: Run Windows Test & Benchmark Executables
      run: |
        $env:Path += ";$PWD\build\Release"
        $files = @("test_runner.exe", "test_nuclear.exe", "benchmark_perf.exe")
        
        foreach ($file in $files) {
            $target = "build\Release\$file"
            if (Test-Path $target) {
                Write-Host "=========================================="
                Write-Host "Running: $file"
                Write-Host "=========================================="
                try {
                    Start-Process -FilePath $target -NoNewWindow -Wait
                } catch {
                    Write-Host "Executed with warnings/notice."
                }
            }
        }
        $host.SetShouldExit(0)
      shell: powershell