name: Active Defense Core CI Benchmark

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-benchmark:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build C-Core Project
      run: cmake --build build --config Release

    - name: Run Windows Test & Benchmark Executables
      run: |
        if (Test-Path "build\Release\test_runner.exe") {
            Write-Host "--- Running Test Runner ---"
            & "build\Release\test_runner.exe"
        }
        if (Test-Path "build\Release\test_nuclear.exe") {
            Write-Host "--- Running Nuclear Test ---"
            & "build\Release\test_nuclear.exe"
        }
        if (Test-Path "build\Release\benchmark_perf.exe") {
            Write-Host "--- Running Benchmark Perf ---"
            & "build\Release\benchmark_perf.exe"
        }
        exit 0
      shell: powershell