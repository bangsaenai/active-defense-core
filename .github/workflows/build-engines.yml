name: Build Active Defense Triple Engines

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-all-platforms:
    name: Build Native Engine
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 1. Linux (ผ่านแล้ว 🟢)
          - os: ubuntu-latest
            artifact_name: libactivedefense.so
            cmd: gcc -O3 -fPIC -shared -Iinclude src/active_defense_encrypt.c src/platform_mem_zero.c -o libactivedefense.so
            
          # 2. macOS (ใช้ gcc/clang แบบ standard shared)
          - os: macos-latest
            artifact_name: libactivedefense.dylib
            cmd: clang -O3 -dynamiclib -undefined dynamic_lookup -Iinclude src/active_defense_encrypt.c src/platform_mem_zero.c -o libactivedefense.dylib

          # 3. Windows (ใช้ ilam/gcc หรือ setup MSVC)
          - os: windows-latest
            artifact_name: activedefense.dll
            cmd: gcc -O3 -shared -Iinclude src/active_defense_encrypt.c src/platform_mem_zero.c -o activedefense.dll

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Compile C99 Core Engine
      run: ${{ matrix.cmd }}

    - name: Upload Binary Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: ${{ matrix.artifact_name }}