name: Build Active Defense Triple Engines

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # 

jobs:
  build-all-platforms:
    name: Build Native Engine
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # 1. Build .so บน Linux Cloud VM (สำหรับ GCP / studio.bangsaenai.com)
          - os: ubuntu-latest
            artifact_name: libactivedefense.so
            cmd: gcc -O3 -fPIC -shared -Iinclude src/active_defense.c -o libactivedefense.so
            
          # 2. Build .dylib บน macOS Cloud VM (สำหรับ Apple Silicon / Mac)
          - os: macos-latest
            artifact_name: libactivedefense.dylib
            cmd: clang -O3 -dynamiclib -Iinclude src/active_defense.c -o libactivedefense.dylib

          # 3. Build .dll บน Windows Cloud VM (สำหรับ C# / Enterprise SDK)
          - os: windows-latest
            artifact_name: activedefense.dll
            cmd: cl /O2 /LD /Iinclude src/active_defense.c /Fe:activedefense.dll

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Compile C99 Core Engine
      run: ${{ matrix.cmd }}

    - name: Upload Binary Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: ${{ matrix.artifact_name }}