name: C-Native Security Code Scan

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  security-audit:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install Cppcheck via Choco
      run: choco install cppcheck -y
      shell: powershell

    - name: Run Cppcheck Security Analysis
      run: |
        $cppcheck = "C:\Program Files\Cppcheck\cppcheck.exe"
        if (Test-Path $cppcheck) {
            & $cppcheck --enable=warning,style,performance,portability --inline-suppr include/ src/
        } else {
            cppcheck --enable=warning,style,performance,portability --inline-suppr include/ src/
        }
      shell: powershell